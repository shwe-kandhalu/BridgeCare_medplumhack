services:
  - type: web
    name: bridgecare-analysis
    runtime: node
    buildCommand: npm ci && npm run build:analysis
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MEDPLUM_ENABLED
        value: "true"
      - key: MEDPLUM_BASE_URL
        sync: false
      - key: MEDPLUM_CLIENT_ID
        sync: false
      - key: MEDPLUM_CLIENT_SECRET
        sync: false
      - key: MEDPLUM_ACCESS_TOKEN
        sync: false
      - key: MEDPLUM_BEARER_TOKEN
        sync: false
      - key: MEDPLUM_TOKEN
        sync: false
      - key: MEDPLUM_TOKEN_ENDPOINT
        sync: false
      - key: STEDI_ENABLED
        value: "true"
      - key: STEDI_API_KEY
        sync: false
      - key: STEDI_BASE_URL
        value: https://healthcare.us.stedi.com/2024-04-01
